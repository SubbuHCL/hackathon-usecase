name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'application-service/**'
      - 'order-service/**'
      - 'patient-service/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'application-service/**'
      - 'order-service/**'
      - 'patient-service/**'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGION: us-central1

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      patient-service-image: ${{ steps.image.outputs.patient-service }}
      appointment-service-image: ${{ steps.image.outputs.appointment-service }}
      order-service-image: ${{ steps.image.outputs.order-service }}
    steps:
      - name: Set image names
        id: image
        run: |
          echo "patient-service=gcr.io/${{ env.GCP_PROJECT_ID }}/patient-service:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "appointment-service=gcr.io/${{ env.GCP_PROJECT_ID }}/appointment-service:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "order-service=gcr.io/${{ env.GCP_PROJECT_ID }}/order-service:${{ github.sha }}" >> $GITHUB_OUTPUT

  build-patient-service:
    name: Build Patient Service
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker

      - name: Build Docker Image
        working-directory: patient-service
        run: docker build -t ${{ needs.setup.outputs.patient-service-image }} -t gcr.io/${{ env.GCP_PROJECT_ID }}/patient-service:latest .

      - name: Push to GCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ needs.setup.outputs.patient-service-image }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/patient-service:latest

  build-appointment-service:
    name: Build Appointment Service
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker

      - name: Build Docker Image
        working-directory: application-service
        run: docker build -t ${{ needs.setup.outputs.appointment-service-image }} -t gcr.io/${{ env.GCP_PROJECT_ID }}/appointment-service:latest .

      - name: Push to GCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ needs.setup.outputs.appointment-service-image }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/appointment-service:latest

  build-order-service:
    name: Build Order Service
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker

      - name: Build Docker Image
        working-directory: order-service
        run: docker build -t ${{ needs.setup.outputs.order-service-image }} -t gcr.io/${{ env.GCP_PROJECT_ID }}/order-service:latest .

      - name: Push to GCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ needs.setup.outputs.order-service-image }}
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/order-service:latest
