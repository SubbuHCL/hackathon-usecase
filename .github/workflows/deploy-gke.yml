name: Deploy to GKE

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy-gke.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER_NAME: gke-cluster
  GKE_REGION: us-central1
  GKE_ZONE: us-central1-a
  DEPLOYMENT_NAME: healthcare-app

jobs:
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Apply Kubernetes Manifests
        run: |
          # Create namespace first
          kubectl apply -f k8s/namespace.yaml
          
          # Apply manifests
          kubectl apply -f k8s/
          
          # Wait for rollout
          kubectl rollout status deployment/patient-service -n healthcare-app --timeout=5m
          kubectl rollout status deployment/appointment-service -n healthcare-app --timeout=5m
          kubectl rollout status deployment/order-service -n healthcare-app --timeout=5m

      - name: Update Image Tags
        run: |
          # Update images with latest tags pushed to GCR
          kubectl set image deployment/patient-service patient-service=gcr.io/${{ env.GCP_PROJECT_ID }}/patient-service:latest \
            -n healthcare-app --record
          kubectl set image deployment/appointment-service appointment-service=gcr.io/${{ env.GCP_PROJECT_ID }}/appointment-service:latest \
            -n healthcare-app --record
          kubectl set image deployment/order-service order-service=gcr.io/${{ env.GCP_PROJECT_ID }}/order-service:latest \
            -n healthcare-app --record

      - name: Verify Deployment
        run: |
          echo "Checking deployment status..."
          kubectl get deployments -n healthcare-app
          kubectl get services -n healthcare-app
          kubectl get pods -n healthcare-app
          
          echo ""
          echo "Getting ingress information..."
          kubectl get ingress -n healthcare-app

      - name: Create Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.GKE_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.GKE_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** healthcare-app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployments" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n healthcare-app -o wide >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          kubectl get services -n healthcare-app -o wide >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback Deployment
    if: failure()
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --region ${{ env.GKE_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Rollback Deployments
        run: |
          echo "Rolling back deployments..."
          kubectl rollout undo deployment/patient-service -n healthcare-app
          kubectl rollout undo deployment/appointment-service -n healthcare-app
          kubectl rollout undo deployment/order-service -n healthcare-app
          
          echo "Waiting for rollback to complete..."
          kubectl rollout status deployment/patient-service -n healthcare-app --timeout=5m
          kubectl rollout status deployment/appointment-service -n healthcare-app --timeout=5m
          kubectl rollout status deployment/order-service -n healthcare-app --timeout=5m
